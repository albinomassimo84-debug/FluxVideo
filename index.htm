<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Upload</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#111827;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      background:#1f2937;
      width:100%;
      max-width:500px;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#60a5fa;
    }

    .upload-box{
      border:2px dashed #60a5fa;
      border-radius:15px;
      padding:40px 20px;
      text-align:center;
      cursor:pointer;
      transition:0.3s;
    }

    .upload-box:hover{
      background:rgba(96,165,250,0.1);
    }

    input[type="file"]{
      display:none;
    }

    .btn{
      margin-top:20px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#2563eb;
    }

    video{
      width:100%;
      margin-top:20px;
      border-radius:10px;
      display:none;
    }

    .info{
      margin-top:15px;
      text-align:center;
      color:#cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Upload Video</h1>

    <label class="upload-box">
      <p>📹 Clicca per caricare un video</p>
      <input type="file" id="videoInput" accept="video/*">
    </label>

    <button class="btn" onclick="uploadVideo()">
      Carica Video
    </button>

    <p class="info" id="status"></p>

    <video id="preview" controls></video>
  </div>

  <script>
    const videoInput = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const statusText = document.getElementById("status");

    videoInput.addEventListener("change", function() {
      const file = this.files[0];

      if(file){
        const videoURL = URL.createObjectURL(file);
        preview.src = videoURL;
        preview.style.display = "block";

        statusText.innerText = "Video selezionato: " + file.name;
      }
    });

    function uploadVideo(){
      const file = videoInput.files[0];

      if(!file){
        alert("Seleziona un video prima!");
        return;
      }

      // Simulazione upload
      statusText.innerText = "Caricamento in corso...";

      setTimeout(() => {
        statusText.innerText = "✅ Video caricato con successo!";
      }, 2000);

      /*
      QUI PUOI INVIARE IL FILE A UN SERVER:

      const formData = new FormData();
      formData.append("video", file);

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        console.log(data);
      });
      */
    }
  </script>

</body>
</html>
