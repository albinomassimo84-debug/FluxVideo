<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Platform</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
      color: white;
    }

    .glow1, .glow2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
    }

    .glow1 {
      width: 450px;
      height: 450px;
      background: rgba(59,130,246,0.35);
      top: -120px;
      left: -120px;
    }

    .glow2 {
      width: 400px;
      height: 400px;
      background: rgba(168,85,247,0.35);
      bottom: -120px;
      right: -120px;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 420px;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      opacity: 0.75;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: white;
      outline: none;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden { display: none; }

    .msg {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">
  <div class="logo">🎬</div>
  <h1>Video Platform</h1>
  <div class="subtitle">Login con Supabase</div>

  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="showLogin()">Accedi</div>
    <div class="tab" id="registerTab" onclick="showRegister()">Registrati</div>
  </div>

  <div id="loginForm" class="form">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Accedi</button>
  </div>

  <div id="registerForm" class="form hidden">
    <input id="registerEmail" type="email" placeholder="Email">
    <input id="registerPassword" type="password" placeholder="Password">
    <button onclick="register()">Crea account</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  // 🔥 CONFIGURA QUI IL TUO SUPABASE
  const supabaseUrl = "sb_publishable_efGCZLbVAtzP4ayaRsraAQ_uWY4SEYH";
  const supabaseKey = "sb_secret_hHySVynfjLAD5ryhe8ForQ_mUGE5ugn";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  const loginTab = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const msg = document.getElementById('msg');

  function showLogin() {
    loginTab.classList.add('active');
    registerTab.classList.remove('active');
    loginForm.classList.remove('hidden');
    registerForm.classList.add('hidden');
  }

  function showRegister() {
    registerTab.classList.add('active');
    loginTab.classList.remove('active');
    registerForm.classList.remove('hidden');
    loginForm.classList.add('hidden');
  }

  async function login() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    msg.textContent = error ? error.message : "Login riuscito 🚀";
  }

  async function register() {
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;

    const { error } = await supabase.auth.signUp({ email, password });

    msg.textContent = error ? error.message : "Account creato! Controlla email 📩";
  }
</script>

</body>
</html>
