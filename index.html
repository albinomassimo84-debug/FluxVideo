<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Platform</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
      color: white;
    }

    .glow1, .glow2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
    }

    .glow1 {
      width: 450px;
      height: 450px;
      background: rgba(59,130,246,0.35);
      top: -120px;
      left: -120px;
    }

    .glow2 {
      width: 400px;
      height: 400px;
      background: rgba(168,85,247,0.35);
      bottom: -120px;
      right: -120px;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 420px;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      opacity: 0.75;
      font-size: 14px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.8;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">
  <div class="logo">🎬</div>
  <h1>Video Platform</h1>
  <div class="subtitle">Login con Netlify</div>

  <button onclick="netlifyIdentity.open('login')">🔐 Accedi</button>
  <button onclick="netlifyIdentity.open('signup')">✨ Registrati</button>
  <button id="logoutBtn" class="hidden" onclick="logout()">🚪 Logout</button>

  <div class="status" id="status">Non sei loggato</div>
</div>

<script>
  const status = document.getElementById('status');
  const logoutBtn = document.getElementById('logoutBtn');

  function updateUser(user) {
    if (user) {
      status.textContent = "Loggato come: " + user.email;
      logoutBtn.classList.remove('hidden');
    } else {
      status.textContent = "Non sei loggato";
      logoutBtn.classList.add('hidden');
    }
  }

  function logout() {
    netlifyIdentity.logout();
  }

  netlifyIdentity.on('init', user => updateUser(user));
  netlifyIdentity.on('login', user => {
    updateUser(user);
    netlifyIdentity.close();
  });
  netlifyIdentity.on('logout', () => updateUser(null));

  netlifyIdentity.init();
</script>

</body>
</html>
