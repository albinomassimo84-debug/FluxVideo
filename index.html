<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Upload</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      overflow: hidden;
    }

    .background-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(59,130,246,0.25);
      filter: blur(120px);
      border-radius: 50%;
      top: -100px;
      left: -100px;
    }

    .background-glow2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(168,85,247,0.25);
      filter: blur(120px);
      border-radius: 50%;
      bottom: -100px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      text-align: center;
      color: white;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .upload-box {
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 18px;
      padding: 30px 20px;
      transition: 0.3s;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
    }

    .upload-box:hover {
      border-color: #60a5fa;
      background: rgba(255,255,255,0.06);
      transform: scale(1.02);
    }

    .upload-box input {
      display: none;
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .upload-text {
      font-size: 15px;
      opacity: 0.9;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(59,130,246,0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(139,92,246,0.5);
    }

    video {
      margin-top: 22px;
      width: 100%;
      border-radius: 16px;
      display: none;
      box-shadow: 0 4px 25px rgba(0,0,0,0.35);
    }

    .file-name {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="background-glow"></div>
<div class="background-glow2"></div>

<div class="container">
  <h1>🎬 Upload Video</h1>
  <p>Carica il tuo video con uno stile moderno.</p>

  <label class="upload-box">
    <div class="upload-icon">📁</div>
    <div class="upload-text">Clicca qui per selezionare un video</div>
    <input type="file" id="videoInput" accept="video/*">
  </label>

  <div class="file-name" id="fileName">Nessun file selezionato</div>

  <button onclick="uploadVideo()">🚀 Carica Video</button>

  <video id="preview" controls></video>
</div>

<script>
  const input = document.getElementById('videoInput');
  const fileName = document.getElementById('fileName');

  input.addEventListener('change', () => {
    if (input.files.length > 0) {
      fileName.textContent = '📹 ' + input.files[0].name;
    }
  });

  function uploadVideo() {
    const preview = document.getElementById('preview');

    if (input.files && input.files[0]) {
      const file = input.files[0];
      const url = URL.createObjectURL(file);

      preview.src = url;
      preview.style.display = 'block';
    } else {
      alert('Seleziona un video prima!');
    }
  }
</script>

</body>
</html>
